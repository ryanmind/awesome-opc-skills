name: Validate skills

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill packages
        run: python3 scripts/validate_skills.py
      - name: Test skill link manager
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python helpers
        run: PYTHONPYCACHEPREFIX=/tmp/agent-skills-pycache python3 -m compileall -q scripts tests skills
